name: Offline tests and upstream smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: Stdlib tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit and HTTP tests
        run: python -m unittest discover -s tests -v
  upstream-smoke:
    name: Real upstream smoke / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned original, chat and inspect real replay trace
        run: python -m tools.upstream_smoke
