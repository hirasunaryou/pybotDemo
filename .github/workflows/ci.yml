name: Offline tests and upstream smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: Stdlib tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify offline standalone HTML
        run: |
          python tools/build_manual.py
          python tools/build_manual.py --check
      - name: macOS launch script — real PyBot + local web API
        if: runner.os == 'macOS'
        env:
          PYBOT_LIVE_LAB_SELF_CHECK: '1'
        run: |
          bash -n start_mac.command
          bash start_mac.command
      - name: Windows batch launcher — real PyBot + local web API
        if: runner.os == 'Windows'
        env:
          PYBOT_LIVE_LAB_SELF_CHECK: '1'
        shell: cmd
        run: call start_windows.bat
  upstream-smoke:
    name: Real upstream smoke / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned original, chat and inspect real replay trace
        run: python -m tools.upstream_smoke
      - name: Syntax-check browser JavaScript
        run: |
          node --check demo/static/app.js
          node --check demo/static/voice.js
          node --check demo/static/theme.js
          node --check demo/static/translation.js
          node --check demo/static/presentation.js
          node --check demo/static/trace-map.js
          node --check demo/static/code-player.js

  mac-cert-recovery:
    name: macOS Python 3.13 / secure SSL recovery
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Simulated SSL failure regression tests
        run: python -m unittest discover -s tests -p test_bootstrap.py -v
      - name: Native system curl HTTPS certificate verification
        run: python -m tools.smoke_curl_ssl
