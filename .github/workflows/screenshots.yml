name: Real UI screenshots for HTML manual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/static/**'
      - 'demo/server.py'
      - 'tools/capture_manual.py'
      - 'tools/capture_docs.py'
      - 'tools/build_manual.py'
      - 'docs/MANUAL.source.html'
      - 'docs/manual.css'
      - 'docs/RESEARCH.html'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: write
concurrency:
  group: pybot-manual-screenshots-main
  cancel-in-progress: true
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Japanese fonts for legible screenshots
        run: |
          sudo timeout 70 apt-get update -qq || echo "Using cached apt metadata"
          sudo timeout 150 env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family} | %{file}\n' 'Noto Sans CJK JP:lang=ja'
      - name: Install browser only in documentation CI
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Capture actual UI with the pinned PyBot
        run: python tools/capture_manual.py
      - name: Assemble the standalone manual with embedded real screenshots
        run: python tools/build_manual.py
      - name: Check both documents in a real browser and capture preview screenshots
        run: python tools/capture_docs.py
      - name: Verify standalone manual is current
        run: python tools/build_manual.py --check
      - name: Commit refreshed standalone HTML and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MANUAL.html docs/images/overview.png docs/images/overview-light.png docs/images/code-trace.png docs/images/manual-preview.png docs/images/research-preview.png
          if git diff --cached --quiet; then
            echo "Manual and screenshots unchanged"
          else
            git commit -m "docs: rebuild portable manual and refresh real UI previews [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
