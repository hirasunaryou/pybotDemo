name: Real UI screenshots for HTML manual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/static/**'
      - 'demo/server.py'
      - 'tools/capture_manual.py'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: write
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser only in documentation CI
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture actual UI with the pinned PyBot
        run: python tools/capture_manual.py
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/overview.png docs/images/code-trace.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: refresh actual PyBot UI screenshots [skip ci]"
            git push origin HEAD:main
          fi
